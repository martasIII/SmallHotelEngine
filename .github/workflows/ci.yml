name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Kontrola a build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Kontrola typů
        run: npm run check

      - name: Build
        run: npm run build

      - name: Uložit sestavený web
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
